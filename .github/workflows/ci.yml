name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install mcp fastmcp flake8 mypy pytest pytest-cov
      - name: Run flake8
        run: >
          flake8
          --max-line-length 120
          --exclude=.git,__pycache__,base/
          server.py
          figma_client.py
          figma_variables.py
          figma_webhooks.py
          figma_accessibility.py
          figma_tokens.py
          figma_multiplatform.py
          figma_codegen.py
          figma_visual.py
          mcp_errors.py
          input_validator.py
          rate_limiter.py

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install mcp fastmcp flake8 mypy pytest pytest-cov
      - name: Run mypy
        run: >
          mypy
          server.py
          figma_client.py
          figma_variables.py
          figma_webhooks.py
          figma_accessibility.py
          figma_tokens.py
          figma_multiplatform.py
          figma_codegen.py
          figma_visual.py
          --python-version 3.8
          --ignore-missing-imports

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install mcp fastmcp flake8 mypy pytest pytest-cov
      - name: Run unit tests
        run: pytest -m "unit" --cov=. --cov-report=xml --cov-fail-under=85

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && secrets.FIGMA_ACCESS_TOKEN != ''
    env:
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install mcp fastmcp flake8 mypy pytest pytest-cov
      - name: Run integration tests
        run: pytest -m "integration"
