repos:
  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: [--max-line-length=120, --exclude=base/]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        args: [--python-version=3.8, --ignore-missing-imports]
        exclude: ^base/
        additional_dependencies: [mcp, fastmcp]
